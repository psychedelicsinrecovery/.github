<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">.github</title>
  <desc id="d">PIR's front step: how we work, what governs us, how to join in. The picture: a 3-sided figure draws itself and its corners arrive one by one. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d153a"/><stop offset="1" stop-color="#111126"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.50" stop-color="#7c55c4"/><stop offset="1.00" stop-color="#baa6e4"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#7c55c4" stop-opacity="0"/><stop offset=".35" stop-color="#7c55c4"/><stop offset="1" stop-color="#baa6e4"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <path d="M935.8 162.2 L962.2 72.5 L1026.7 140.2Z" fill="#302256" fill-opacity=".35" stroke="#483278" stroke-width="1.5"/>
    <path d="M974.9 125.0L996.1 212.5" stroke="#302256" stroke-width="1"/>
    <path d="M974.9 125.0L888.6 99.6" stroke="#302256" stroke-width="1"/>
    <path d="M974.9 125.0L1040.1 62.9" stroke="#302256" stroke-width="1"/>
    <path class="draw" pathLength="100" d="M996.1 212.5 L888.6 99.6 L1040.1 62.9Z" fill="none" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.30s"/>
    <circle class="arrive" style="animation-delay:0.35s" cx="996.1" cy="212.5" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:1.32s" cx="888.6" cy="99.6" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="arrive" style="animation-delay:2.28s" cx="1040.1" cy="62.9" r="7" fill="#111126" stroke="#baa6e4" stroke-width="2.5"/>
    <circle class="halo" cx="974.9" cy="125.0" r="12" fill="none" stroke="#baa6e4" stroke-width="2"/>
    <circle class="breathe" cx="974.9" cy="125.0" r="10" fill="#7c55c4"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#3b1f6e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#7c3aed"/><rect x="600.0" y="248" width="300.5" height="12" fill="#5b2bb5"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ede9fe"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#9373ce" font-size="15" font-weight="700" letter-spacing=".6">PIR® · Psychedelics In Recovery™</text><text x="56" y="122.2" fill="#ede9fe" font-size="60" font-weight="700" letter-spacing="-.5">.github</text><text x="56" y="166.0" fill="#d0cbe3" font-size="23">PIR's front step: how we work, what governs us,</text><text x="56" y="196.8" fill="#d0cbe3" font-size="23">how to join in.</text></g>
  </g>
</svg>
