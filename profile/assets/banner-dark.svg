<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">PIR®, Psychedelics In Recovery™</title>
<desc id="d">A night sky slowly breathing toward daybreak: soft violet, cyan and gold light drifting over quiet stars. A safe, sacred space to integrate and discuss the role of psychedelics in your recovery journey.</desc>
<style>
.wall{filter:url(#wall)}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 9s ease-in-out infinite}
.breathe.b2{animation-duration:11s;animation-delay:-4s}
.breathe.b3{animation-duration:7s;animation-delay:-2s}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.045);opacity:1}}
.tw{animation:tw 9s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.22}50%{opacity:.95}}
.glow{animation:glow 10s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}

@media (prefers-reduced-motion: reduce){*{animation:none !important}.wall{filter:url(#wall-still)}}
</style>
<defs>
<filter id="wall" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.009" numOctaves="2" seed="11" result="n">
    <animate attributeName="baseFrequency" dur="12s" values="0.0045 0.009;0.006 0.0115;0.0045 0.009" repeatCount="indefinite"/>
  </feTurbulence>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
  <feColorMatrix in="d" type="hueRotate" values="0">
    <animate attributeName="values" dur="30s" values="0;14;0;-14;0" repeatCount="indefinite"/>
  </feColorMatrix>
</filter>
<filter id="wall-still" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.009" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<clipPath id="clip"><rect width="1280" height="400" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="#06050e"/><stop offset=".55" stop-color="#0d0a22"/><stop offset="1" stop-color="#171035"/></linearGradient>
<radialGradient id="nv"><stop offset="0" stop-color="#b48cff" stop-opacity="0.55"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></radialGradient>
<radialGradient id="nc"><stop offset="0" stop-color="#6fd6ff" stop-opacity="0.32"/><stop offset="1" stop-color="#6fd6ff" stop-opacity="0"/></radialGradient>
<radialGradient id="ng"><stop offset="0" stop-color="#f2c46d" stop-opacity="0.24"/><stop offset="1" stop-color="#f2c46d" stop-opacity="0"/></radialGradient>
<radialGradient id="nv2"><stop offset="0" stop-color="#b48cff" stop-opacity="0.24750000000000003"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></radialGradient>
<linearGradient id="dawn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9b3ff" stop-opacity="0"/><stop offset=".55" stop-color="#f2c46d" stop-opacity=".9"/><stop offset="1" stop-color="#c9b3ff" stop-opacity="0"/></linearGradient>
<radialGradient id="dawnglow"><stop offset="0" stop-color="#f2c46d" stop-opacity="0.3"/><stop offset="1" stop-color="#f2c46d" stop-opacity="0"/></radialGradient>
</defs>
